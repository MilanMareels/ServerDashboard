services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-database
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuperGeheimWachtwoord123!
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqldata:
