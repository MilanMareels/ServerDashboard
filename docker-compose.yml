services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-database
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: ServerDashboardApi/Dockerfile
    container_name: server-dashboard-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=ServerDashboardDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=true;
    ports:
      - "5050:8080"
    devices:
      - "/dev/ttyACM0:/dev/ttyACM0"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: ServerDashboardClient/Dockerfile
    container_name: server-dashboard-client
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ApiBaseUrl=http://api:8080/api/
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  sqldata:
